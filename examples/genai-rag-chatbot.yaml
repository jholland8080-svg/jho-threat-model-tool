# Example: internal GenAI assistant (RAG) on EKS calling Amazon Bedrock.
# Matches the worked example in the threat modeling guide.
# Runs in the private hybrid network on top of the AWS org guardrails (platforms/example-baseline.yaml),
# so controls those platforms enforce (RCP data perimeter, CMK encryption, VPC endpoints, egress through
# the network perimeter, auto-enrolled security tooling) are inherited, not listed here:
#   python -m tmtool analyze examples/genai-rag-chatbot.yaml --platforms platforms/example-baseline.yaml

app:
  name: Employee GenAI Assistant
  description: >
    Internal chatbot that answers employee questions using company policy and procedure documents.
    Runs on a shared EKS cluster and calls Amazon Bedrock through a VPC endpoint.
  owner: Digital Workplace team
  stage: design
  criticality: medium
  users: [employees, admins]
  regulatory: [glba]
  controls: [sso, audit_logging, logging_siem]
  platforms: [aws-network]       # private hybrid network, which builds on the AWS org guardrails

zones:
  - id: corp
    name: Corporate network
  - id: app-vpc
    name: Application VPC (EKS)
  - id: aws-managed
    name: AWS managed services

components:
  - id: employee
    name: Employee
    type: user
    zone: corp

  - id: alb
    name: Internal load balancer
    type: load_balancer
    zone: app-vpc
    controls: [sso, mfa, tls]

  - id: chatbot-api
    name: Chatbot API
    type: container_workload
    zone: app-vpc
    data: [internal, confidential]
    controls: [admission_control, non_root, network_policy]   # cluster-level controls the team owns

  - id: bedrock
    name: Amazon Bedrock (Claude)
    type: llm
    zone: aws-managed
    ai:
      rag: true
      agent_actions: false
      untrusted_content: false
      decision_support: false
    controls: [guardrails, model_allowlist, invocation_logging]

  - id: knowledge-base
    name: Bedrock Knowledge Base
    type: vector_store
    zone: aws-managed
    data: [internal, confidential]
    controls: [guardrails, model_allowlist, invocation_logging]

  - id: docs-bucket
    name: Policy documents (S3)
    type: object_storage
    zone: aws-managed
    data: [internal, confidential]
    controls: []                 # RCP data perimeter, CMK encryption, and VPC endpoints are inherited

  - id: logs
    name: Invocation logs (CloudWatch → SIEM)
    type: logging
    zone: aws-managed
    data: [confidential]

  - id: pipeline
    name: GitHub Actions pipeline
    type: ci_cd
    zone: corp
    controls: [branch_protection, deploy_approvals, secrets_scanning]

flows:
  - id: F1
    from: employee
    to: alb
    protocol: HTTPS
    data: [internal]
    encrypted: true
    authenticated: true
  - id: F2
    from: alb
    to: chatbot-api
    protocol: HTTPS
    data: [internal]
    encrypted: true
    authenticated: true
  - id: F3
    from: chatbot-api
    to: bedrock
    protocol: HTTPS (VPC endpoint)
    data: [internal, confidential]
    encrypted: true
    authenticated: true
  - id: F4
    from: bedrock
    to: knowledge-base
    protocol: Retrieval
    data: [confidential]
    encrypted: true
    authenticated: true
  - id: F5
    from: docs-bucket
    to: knowledge-base
    protocol: Ingestion sync
    data: [confidential]
    encrypted: true
    authenticated: true
  - id: F6
    from: bedrock
    to: logs
    protocol: Invocation logging
    data: [confidential]
    encrypted: true
    authenticated: true
  - id: F7
    from: pipeline
    to: chatbot-api
    protocol: Deploy
    data: []
    encrypted: true
    authenticated: true
